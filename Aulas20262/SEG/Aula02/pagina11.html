<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página 11</title>
  </head>

  <body>
    <h1>Operadores Aritméticos</h1>

    <script>
      let n1 = Number(prompt('Digite um número:', ''))
      let n2 = Number(prompt('Digite outro número:', ''))

      let soma = n1 + n2
      let subtracao = n1 - n2
      let multiplicacao = n1 * n2
      let divisao = n1 / n2
      let resto = n1 % n2
    </script>

    <p>Soma: <script>document.write(soma)</script></p>
    <p>Subtração: <script>document.write(subtracao)</script></p>
    <p>Multiplicação: <script>document.write(multiplicacao)</script></p>
    <p>Divisão: <script>document.write(divisao)</script></p>
    <p>Resto da divisão: <script>document.write(resto)</script></p>
  </body>
</html>
