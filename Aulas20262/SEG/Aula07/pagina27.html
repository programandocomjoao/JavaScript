<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página 27</title>
  </head>

  <body>
    <h1>DOM (Document Object Model)</h1>  

    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Porro quod earum commodi eum adipisci rem nisi esse accusantium ipsam nam voluptatibus soluta ipsum maiores unde a molestiae nesciunt, corporis deleniti.</p>

    <script>
      let corpo = document.body

      mudarFundo = function(cor) {
        corpo.style.backgroundColor = cor
      }
    </script>

    <hr>
    <p><label for="cor">Escolha uma cor para o fundo:</label>
      <input type="color" id="cor" onchange="mudarFundo(this.value)">
    </p>
  </body>
</html>
