<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Bolas</title>
    <script src="calculadoraBola.js"></script>
  </head>

  <body>
    <h1>Calculadora de Bolas</h1>  

    <form>
      <fieldset>
        <legend>DADOS DA BOLA</legend>

        <p><label for="raio">RAIO:</label>
          <input type="text" id="raio" size="5" autofocus>
        </p>

        <hr>
          <p><input type="button" value="Calcular" onclick="calcularComp(); calcularArea(); calcularVolume()"></p>
        <hr>

        <p><label for="C">COMPRIMENTO:</label>
          <output id="C"></output>cm
        </p>

        <p><label for="A">ÁREA:</label>
          <output id="A"></output>cm<sup>2</sup>
        </p>

        <p><label for="V">VOLUME:</label>
          <output id="V"></output>cm<sup>3</sup>
        </p>
      </fieldset>
    </form>
  </body>
</html>
