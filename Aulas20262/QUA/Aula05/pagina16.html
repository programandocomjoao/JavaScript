<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página 16</title>
  </head>

  <body>
    <h1>Condição</h1>

    <script>
      let n1 = Number(prompt('Digite um número:', ''))
      let n2 = Number(prompt('Digite outro número:', ''))

      document.write(`<p>${n1} é igual a ${n2}: ${n1 == n2}</p>`)
      document.write(`<p>${n1} é diferente de ${n2}: ${n1 != n2}</p>`)
      document.write(`<p>${n1} é maior que ${n2}: ${n1 > n2}</p>`)
      document.write(`<p>${n1} é menor que ${n2}: ${n1 < n2}</p>`)
      document.write(`<p>${n1} é maior ou igual que ${n2}: ${n1 >= n2}</p>`)
      document.write(`<p>${n1} é menor ou igual que ${n2}: ${n1 <= n2}</p>`)
    </script>
  </body>
</html>
