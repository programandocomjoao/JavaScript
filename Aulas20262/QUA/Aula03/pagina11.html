<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página 11</title>
  </head>

  <body>
    <h1>Exponenciação</h1>

    <script>
      let b = Number(prompt('Digite a base:', ''))
      let e = Number(prompt('Digite o expoente:', ''))

      let r = Math.pow(b, e)

      document.write(`<p>${b}<sup>${e}</sup> = ${r}</p>`)
    </script>
  </body>
</html>
