<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página 23</title>
  </head>

  <body>
    <h1>Estrutura de Repetição WHILE</h1>

    <script>
      let preco, soma = 0

      preco = Number(prompt(`Digite o preço do produto: R$`, ''))

      while(preco > 0) {
        soma += preco
        preco = Number(prompt(`Digite o preço do produto: R$`, ''))
      }

      document.write(`<p>A soma dos preços é R$ ${soma.toFixed(2)}</p>`)
    </script>
  </body>
</html>
