<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página 07</title>
  </head>

  <body>
    <h1>Operação de Entrada</h1>

    <script>
      let nome = prompt('Digite o nome:', '')
      let idade = prompt('Digite a idade:', '')
      let peso = prompt('Digite o peso:', '')
      let altura = prompt('Digite a altura:', '')
      let sexo = prompt('Digite o sexo<F/M>:', '')

      document.write(`<p>Nome: ${nome}</p>`)
      document.write(`<p>Idade: ${idade} anos</p>`)
      document.write(`<p>Peso: ${peso}kg</p>`)
      document.write(`<p>Altura: ${altura}m</p>`)
      document.write(`<p>Sexo: ${sexo}</p>`)
    </script>
  </body>
</html>
