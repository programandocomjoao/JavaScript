<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página 05</title>
  </head>

  <body>
    <h1>Declaração de Variáveis</h1>

    <script>
      let nome, idade, peso, altura, sexo

      nome = 'Fernanda'
      idade = 13
      peso = 37.9
      altura = 1.49
      sexo = 'F'

      document.write('<p>Nome: ' + nome + '</p>')
      document.write('<p>Idade: ' + idade + ' anos</p>')
      document.write('<p>Peso: ' + peso + 'kg</p>')
      document.write('<p>Altura: ' + altura + 'm</p>')
      document.write('<p>Sexo: ' + sexo + '</p>')
    </script>
  </body>
</html>
