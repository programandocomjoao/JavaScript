<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página 15</title>
  </head>

  <body>
    <h1>Sorteio de Números Reais</h1>

    <script>
      let n1 = Math.random()
      let n2 = Math.round(Math.random() * 20)
      let n3 = Math.round(Math.random() * 99 + 1)
      let n4 = Math.round(Math.random() * 62 + 17)

      document.write(`<p>Número entre 0 e 1: ${n1}</p>`)
      document.write(`<p>Número entre 0 e 20: ${n2}</p>`)
      document.write(`<p>Número entre 1 e 100: ${n3}</p>`)
      document.write(`<p>Número entre 17 e 79: ${n4}</p>`)
    </script>

  </body>
</html>
