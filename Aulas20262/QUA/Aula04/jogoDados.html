<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dado da Sorte</title>
  </head>

  <body>
    <h1>Jogo Dado da Sorte</h1>

    <fieldset>
      <legend>DADO SORTEADO</legend>

      <p><img src="" id="dadosorteado"></p>
    </fieldset><br>

    <fieldset>
      <legend>JOGAR DADO</legend>

      <p>
        <input type="button" value="Jogar Dado" onclick="rodarDado()">
        <input type="button" value="Parar Dado" onclick="pararDado()">
      </p>

      <hr>
      <p><img src="dado1.png" id="dadojogado"></p>
      <hr>

      <p>
        Acertos: <input type="text" size="5" id="acertos" value="0">
        Erros: <input type="text" size="5" id="erros" value="0">
        <input type="button" value="Jogar Novamente" onclick="location.reload()">
      </p>
    </fieldset>

    <script>
      let dados = ['dado1.png', 'dado2.png', 'dado3.png', 'dado4.png', 'dado5.png', 'dado6.png']
      let lado = Math.round(Math.random() * 5)
      document.getElementById('dadosorteado').src = dados[lado]

      let i = 0
      let acertos = 0
      let erros = 0

      jogarDado = function() {
        document.getElementById('dadojogado').src = dados[i]
        i++

        if(i == 6)
        i = 0
      }

      rodarDado = function() {
        game = setInterval('jogarDado()', 100)
      }

      pararDado = function() {
        clearInterval(game)

        if(lado == i-1) {
          alert('Parabéns! Você acertou!')
          acertos++
          document.getElementById('acertos').value = acertos
        }
        else {
          alert('Que pena! Você errou!')
          erros++
          document.getElementById('erros').value = erros
        }
      }
    </script>
  </body>
</html>
