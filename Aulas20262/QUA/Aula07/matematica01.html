<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadrado</title>
    <script src="matematica.js"></script>
  </head>

  <body>
    <h1>Cálculo do Quadrado</h1>

    <form>
      <fieldset>
        <legend>DADOS PARA CALCULAR</legend>

        <p><label for="numero">Número:</label>
          <input type="text" id="numero" size="5" autofocus>
        </p>

        <hr>
        <p><input type="button" value="Calcular Quadrado" onclick="
          let n = Number(document.getElementById('numero').value)
          document.getElementById('resultado').value = calcularQuadrado(n)
        "></p>
        <hr>

        <p><label for="resultado">Quadrado:</label>
          <output id="resultado"></output>
        </p>
      </fieldset>
    </form>
  </body>
</html>
